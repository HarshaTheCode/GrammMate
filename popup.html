<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrammMate Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #18181b;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --card-bg: rgba(255, 255, 255, 0.03);
      --green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      width: 280px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
    }

    .brand svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
    }

    .status-badge.active .status-dot {
      background-color: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-badge.active {
      color: #ffffff;
    }

    /* Enable/Disable Toggle Row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 600;
    }

    /* Custom Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #27272a;
      transition: .2s;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #ffffff;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #09090b;
    }

    /* Stats Section */
    .stats-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: left;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* History Section */
    .history-section {
      margin-bottom: 16px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .history-list {
      max-height: 130px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    /* Scrollbar styling for history */
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    .history-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 30px 8px 8px;
      position: relative;
      text-align: left;
      font-size: 11px;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .history-original {
      color: var(--text-muted);
      text-decoration: line-through;
      margin-bottom: 2px;
      word-break: break-word;
      display: block;
    }

    .history-corrected {
      color: #ffffff;
      font-weight: 500;
      word-break: break-word;
      display: block;
    }

    .btn-copy {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      border-radius: 4px;
    }

    .btn-copy:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-copy svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .history-empty {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }

    /* Footer / Navigation */
    .footer {
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .btn-action {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 8px 0;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-action svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L14.8 8.6L22 9.2L16.5 13.9L18.2 21L12 17.2L5.8 21L7.5 13.9L2 9.2L9.2 8.6L12 2Z"/></svg>
      <span>GrammMate</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Off</span>
    </div>
  </div>

  <!-- Enable Toggle Row -->
  <div class="toggle-row">
    <span class="toggle-label">Active Overlay</span>
    <label class="switch">
      <input type="checkbox" id="btnToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Statistics -->
  <div class="stats-section">
    <div class="section-title">Local Usage Stats</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="statsCount">0</div>
        <div class="stat-lbl">Corrections</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statsTokens">0</div>
        <div class="stat-lbl">Tokens Used</div>
      </div>
    </div>
  </div>

  <!-- History Section -->
  <div class="history-section">
    <div class="section-title">Recent Corrections</div>
    <div class="history-list" id="historyList">
      <!-- Generated list items -->
    </div>
  </div>

  <!-- Footer Navigation -->
  <div class="footer">
    <button type="button" class="btn-action" id="btnSettings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Options
    </button>
    <button type="button" class="btn-action" id="btnPlayground">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/><path d="M9 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/></svg>
      Playground
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
